<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="30">
<title>En mantenimiento — JDH Speak</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:#0f0d17; color:#e7e4f0; padding:24px;
    font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:30rem; text-align:center; }
  .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:#8b7cf6;
    margin-right:10px; vertical-align:middle; animation:pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.35;transform:scale(.9)} 50%{opacity:1;transform:scale(1)} }
  h1 { font-size:1.5rem; margin:0 0 .75rem; }
  p { color:#b7b2c9; margin:.6rem 0; }
  .muted { font-size:.85rem; color:#7d7893; margin-top:1.5rem; }
</style>
</head>
<body>
<main role="main">
  <h1><span class="dot" aria-hidden="true"></span>Estamos en mantenimiento</h1>
  <p>Estamos actualizando la plataforma. Volverá a estar disponible en unos minutos.</p>
  <p>No hace falta que hagas nada: esta página se actualiza sola y te llevará de vuelta apenas termine.</p>
  <p class="muted">Reintentando automáticamente cada 30 segundos…</p>
</main>
</body>
</html>

# coturn para JDH Speak — ver docs/turn-server.md
# Gestionado a mano. Contiene la credencial: chmod 640 root:turnserver.

listening-port=3478
# Sin TLS por ahora: no abrimos 5349 (menos superficie). Si algun dia se quiere
# turns:, hace falta cert + abrir 5349 en router y ufw.
no-tls
no-dtls

# Rango de relay. IMPORTANTE: el router ya reenvia 40000-40100 a este host y ese
# rango se COMPARTE con el SFU: mediasoup usa un WebRtcServer por worker en puertos
# FIJOS 40000-40007 (4 workers x 2 IPs) y el relay WebTransport 40008
# (server/src/mediasoup-config.ts). Deben seguir siendo disjuntos.
# Antes 40060-40100 (41 puertos): se agotaba ("no available ports").
min-port=40009
max-port=40100

# El Pi esta detras del router: IP publica -> IP local.
# Lo mantiene actualizado /usr/local/bin/sonicroom-announce-ip.sh si cambia.
external-ip=<IP_PUBLICA>/192.168.4.2
listening-ip=192.168.4.2
relay-ip=192.168.4.2

# --- Autenticacion (obligatoria: sin esto seria un RELAY ABIERTO) ---
fingerprint
lt-cred-mech
realm=jdh.privatedns.org
user=<REDACTED — ver /etc/turnserver.conf en el Pi>
stale-nonce=600

# --- Cuotas: limitan abuso de ancho de banda y agotamiento de puertos ---
user-quota=0
total-quota=0
# Bytes/seg por sesion (~2 Mbit/s). El audio usa ~16-32 KB/s, asi que sobra,
# pero impide que alguien lo use para video/descargas.
max-bps=250000

# --- Higiene / superficie ---
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Log via syslog -> journald (acotado por journald; no crece un fichero suelto)
syslog
no-stdout-log

# --- Impedir que el TURN se use para alcanzar la LAN o rangos especiales ---
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-239.255.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

packages:
  - "client"
  - "server"

# pnpm 11.4+ gates native build scripts behind an explicit allow-list and
# exits 1 (ERR_PNPM_IGNORED_BUILDS) on any install/run until each is decided.
# esbuild (client bundler) and mediasoup (native SFU worker binary) are trusted
# and MUST build, so they're set true here. Keep them true after a pnpm bump —
# if pnpm rewrites these to "set this to true or false", just set them back.
allowBuilds:
  esbuild: true
  mediasoup: true
  # THROWAWAY (branch feat/webtransport-jam): the QUIC transport fetches a
  # prebuilt native binary via its install script (prebuild-install). Reverting
  # the branch drops this again.
  "@fails-components/webtransport-transport-http3-quiche": true

onlyBuiltDependencies:
  - esbuild
  - mediasoup
  - "@fails-components/webtransport-transport-http3-quiche"

# THROWAWAY (branch only): pin the QUIC transport to 1.4.0 — the newest arm64
# prebuild that loads under the Pi's glibc 2.36 (1.5.1+ need GLIBC_2.38).
overrides:
  "@fails-components/webtransport-transport-http3-quiche": "1.4.0"
